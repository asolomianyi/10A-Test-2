 return[q[0],!a?"(no answer)":a.w===-1?"No mistake":'"'+cl(seg(q,a.w))+'" -> '+(a.c==null?"?":q[2][a.c]),q[1]?'"'+cl(seg(q,q[1][0]))+'" -> '+q[2][q[3]]:"No mistake"]}

 if(a&&a.w>=0)h+=`<p class=mu>Replace “${esc(cl(seg(q,a.w)))}” with:</p>`+q[2].map((o,j)=>`<button class="o${a.c===j?" s":""}" data-a=c data-i=${i} data-c=${j}>${"ABCD"[j]}) ${esc(o)}</button>`).join("");

function fq2(q,i,a){const tk=q[0].split(" "),m=a?(a.w===-1?0:1):null,D=` data-i=${i}`;
 let h=`<div class=q><p class=sen><b class=nm>${i+1}</b> ${esc(q[0])}</p><p class=st><span class=bd>1</span>Is there a mistake?<small>Чи є помилка в реченні?</small></p><div class=two><button class="o${m===0?" s":""}" data-a=w${D} data-k=-1>✓ Помилок немає</button><button class="o${m===1?" s":""}" data-a=m${D}>✗ Є помилка</button></div>`;

function runners(){let ok=false;try{const c=document.createElement("canvas").getContext("2d");c.font="32px sans-serif";ok=c.measureText("\ud83c\udfc3\u200d\u27a1\ufe0f").width<c.measureText("\ud83c\udfc3").width*1.5}catch(_){}

const msg=s=>{const m=$("msg");if(m)m.textContent=s};
async function pdf(){const J=window.jspdf&&window.jspdf.jsPDF;if(!J)return msg("Не вдалося завантажити модуль PDF. Перевірте інтернет і спробуйте ще раз.");

 const P=TK.map((_,t)=>pts(t)),tot=Math.round(P.reduce((a,b)=>a+b,0)/4);
 L("Diagnostic Test: Sports",16,1);L("Student: "+(S.n||"-"));L("Student email: "+S.e);L("Date: "+new Date().toISOString().slice(0,10));y+=3;
